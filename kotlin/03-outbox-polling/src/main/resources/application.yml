spring:
  application:
    name: outbox-polling
  datasource:
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      # 이 단계의 테이블은 스키마 k03에 둔다 — compose DB `lab`을 다른 단계와 같이 써도 안 섞이게 (docs/SPEC.md "스키마 규칙").
      # Hikari가 커넥션마다 setSchema → pgjdbc가 `SET search_path TO 'k03'` → schema.sql·JdbcTemplate 모두 접두어 없이 k03만 본다.
      # URL의 ?currentSchema= 와 달리 @ServiceConnection(테스트)·--spring.datasource.url(e2e)이 URL을 바꿔도 남는다.
      schema: k03
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all   # 모든 replica가 받았을 때만 "발행 성공" → 그 다음에야 published_at을 찍는다

lab:
  topic: payment.events
  outbox:
    relay:
      enabled: true       # 테스트에서는 false로 끄고 relayOnce()를 직접 호출한다
      interval-ms: 500
      batch-size: 100
