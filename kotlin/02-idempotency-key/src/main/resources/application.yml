spring:
  application:
    name: idempotency-key
  datasource:
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      # 이 단계의 테이블은 스키마 k02에 둔다 — compose DB `lab`을 다른 단계와 같이 써도 안 섞이게 (docs/SPEC.md "스키마 규칙").
      # Hikari가 커넥션마다 setSchema → pgjdbc가 `SET search_path TO 'k02'` → schema.sql·JdbcTemplate 모두 접두어 없이 k02만 본다.
      # URL의 ?currentSchema= 와 달리 @ServiceConnection(테스트)·--spring.datasource.url(e2e)이 URL을 바꿔도 남는다.
      schema: k02
  sql:
    init:
      mode: always

lab:
  idempotency:
    # 잠금이 이 시간보다 오래되면 "처리하던 서버가 죽었다"고 보고 다른 요청이 이어받을 수 있다.
    lock-timeout: 30s
