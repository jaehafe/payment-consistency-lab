server:
  port: 8090   # infra/observability/prometheus.yml 이 host.docker.internal:8090/actuator/prometheus 를 긁는다

spring:
  application:
    name: observability
  datasource:
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      # 이 단계의 테이블은 스키마 k10에 둔다 — compose DB `lab`을 다른 단계와 같이 써도 안 섞이게 (docs/SPEC.md "스키마 규칙").
      # Hikari가 커넥션마다 setSchema → pgjdbc가 `SET search_path TO 'k10'` → schema.sql·JdbcTemplate 모두 접두어 없이 k10만 본다.
      # URL의 ?currentSchema= 와 달리 @ServiceConnection(테스트)·--spring.datasource.url(e2e)이 URL을 바꿔도 남는다.
      schema: k10
  sql:
    init:
      mode: always

logging:
  structured:
    format:
      # 콘솔 로그를 한 줄 JSON으로. MDC 값(request_id, payment_id, order_id, idempotency_key)이 최상위 필드로 들어간다.
      # → 로그 수집기(Loki/ELK)에서 필드로 검색하거나, 로컬에선 jq로 거른다.
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

lab:
  pg:
    # PG 응답 타임아웃(Fake PG가 흉내 냄). 이보다 늦으면 UNKNOWN. PgLatencyHigh 임계값(3s)보다 커야 타임아웃 급증 때 p99 알림도 뜬다.
    timeout-ms: 5000
