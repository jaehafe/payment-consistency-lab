spring:
  application:
    name: balance-concurrency
  datasource:
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      # 이 단계의 테이블은 스키마 k06에 둔다 — compose DB `lab`을 다른 단계와 같이 써도 안 섞이게 (docs/SPEC.md "스키마 규칙").
      # Hikari가 커넥션마다 setSchema → pgjdbc가 `SET search_path TO 'k06'` → schema.sql·JdbcTemplate 모두 접두어 없이 k06만 본다.
      # URL의 ?currentSchema= 와 달리 @ServiceConnection(테스트)·--spring.datasource.url(e2e)이 URL을 바꿔도 남는다.
      schema: k06
      # 동시 요청 10건이 각자 커넥션을 잡고 진짜로 경합하도록 풀을 넉넉히 둔다.
      # (풀이 작으면 요청들이 커넥션 대기로 직렬화되어 레이스가 가려진다)
      maximum-pool-size: 30
  sql:
    init:
      mode: always
