spring:
  application:
    name: dual-write-problem
  # 수동 실행용 기본값 (infra/docker-compose.yml). 테스트에서는 Testcontainers가 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      # 이 단계의 테이블은 스키마 k01에 둔다 — compose DB `lab`을 다른 단계와 같이 써도 안 섞이게 (docs/SPEC.md "스키마 규칙").
      # Hikari가 커넥션마다 setSchema → pgjdbc가 `SET search_path TO 'k01'` → schema.sql·JdbcTemplate 모두 접두어 없이 k01만 본다.
      # URL의 ?currentSchema= 와 달리 @ServiceConnection(테스트)·--spring.datasource.url(e2e)이 URL을 바꿔도 남는다.
      schema: k01
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all   # 모든 replica가 받았을 때만 성공으로 본다

lab:
  topic: payment.events
