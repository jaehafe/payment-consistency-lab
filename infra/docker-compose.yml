# 로컬 실습용 인프라. 단계별 테스트는 Testcontainers로 자동 기동되므로
# 이 compose는 앱을 직접 띄워보거나 04-outbox-cdc(Debezium)를 실습할 때 사용한다.
#
# name 을 고정하는 이유: 없으면 디렉터리 이름(infra)이 프로젝트 이름이 되어,
# 다른 레포의 infra/docker-compose.yml 과 같은 프로젝트로 취급된다
# (같은 서비스 이름 postgres 의 기존 컨테이너를 재생성·볼륨 재사용하는 사고).
name: payment-consistency-lab

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]   # Debezium CDC를 위해 logical replication 활성화
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["15432:5432"]

  redpanda:   # Kafka API 호환 브로커 (JVM/ZooKeeper 없이 가볍게)
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]

  connect:    # Debezium (Kafka Connect) — 04-outbox-cdc 전용
    image: quay.io/debezium/connect:2.7
    depends_on: [postgres, redpanda]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["8083:8083"]
    profiles: ["cdc"]

  prometheus:   # 10-observability 전용
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]
    profiles: ["obs"]

  grafana:      # 10-observability 전용 (admin/admin)
    image: grafana/grafana:11.2.2
    depends_on: [prometheus]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    profiles: ["obs"]
